<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140821"/>
      <stop offset="0.55" stop-color="#2d1046"/>
      <stop offset="1" stop-color="#55164f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ff7ac6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7ac6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3e1"/>
      <stop offset="0.5" stop-color="#ff5fb4"/>
      <stop offset="1" stop-color="#9d4dff"/>
    </linearGradient>
    <linearGradient id="wingB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7a8ff"/>
      <stop offset="0.6" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#4b2bbf"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd6ef"/>
      <stop offset="0.5" stop-color="#ff8fd0"/>
      <stop offset="1" stop-color="#c9a6ff"/>
    </linearGradient>

    <!-- one wing pair, body at origin -->
    <g id="wings">
      <path d="M0,-1 C8,-30 44,-40 52,-20 C57,-6 34,6 0,2 Z"/>
      <path d="M0,3 C24,6 40,20 32,36 C24,48 6,32 0,9 Z" opacity="0.88"/>
      <circle cx="30" cy="-18" r="4" fill="#fff" opacity="0.55"/>
      <circle cx="20" cy="20" r="3" fill="#fff" opacity="0.45"/>
    </g>

    <g id="flyA">
      <g fill="url(#wingA)">
        <g><use xlink:href="#wings"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.2 1;1 1" dur="0.5s" repeatCount="indefinite"/></g>
        <g transform="scale(-1 1)"><g><use xlink:href="#wings"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.2 1;1 1" dur="0.5s" repeatCount="indefinite"/></g></g>
      </g>
      <ellipse cx="0" cy="6" rx="3.2" ry="20" fill="#ffe3f5"/>
      <path d="M-1,-12 C-6,-24 -10,-28 -14,-30 M1,-12 C6,-24 10,-28 14,-30" stroke="#ffe3f5" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g id="flyB">
      <g fill="url(#wingB)">
        <g><use xlink:href="#wings"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.25 1;1 1" dur="0.6s" repeatCount="indefinite"/></g>
        <g transform="scale(-1 1)"><g><use xlink:href="#wings"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.25 1;1 1" dur="0.6s" repeatCount="indefinite"/></g></g>
      </g>
      <ellipse cx="0" cy="6" rx="3.2" ry="20" fill="#efe0ff"/>
      <path d="M-1,-12 C-6,-24 -10,-28 -14,-30 M1,-12 C6,-24 10,-28 14,-30" stroke="#efe0ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow)"/>

  <!-- twinkling sparkles -->
  <g fill="#ffe3f5">
    <circle cx="90" cy="60" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="300" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="315" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="70" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="250" r="1.7"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="28" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="210" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="330" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ffc2e6" opacity="0.9">
    <path d="M330 95 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></path>
    <path d="M880 285 l2.5 6.5 6.5 2.5 -6.5 2.5 -2.5 6.5 -2.5 -6.5 -6.5 -2.5 6.5 -2.5z"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></path>
  </g>

    <!-- dotted flight trail -->
  <path d="M80,285 C300,318 900,318 1120,285 C1165,220 1165,130 1120,75 C900,42 300,42 80,75 C35,130 35,220 80,285 Z" fill="none" stroke="#ff9ad5" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- flying butterflies -->
  <g>
    <use xlink:href="#flyA" transform="scale(0.8)"/>
    <animateMotion dur="22s" repeatCount="indefinite" path="M80,285 C300,318 900,318 1120,285 C1165,220 1165,130 1120,75 C900,42 300,42 80,75 C35,130 35,220 80,285 Z"/>
  </g>
  <g transform="translate(1030 200)">
    <g>
      <use xlink:href="#flyB" transform="rotate(18) scale(0.75)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-8 -10;0 0" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(175 190)">
    <g>
      <use xlink:href="#flyA" transform="rotate(-15) scale(0.6)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;6 -8;0 0" dur="3.4s" repeatCount="indefinite"/>
    </g>
  </g>
  </g>

  <!-- text -->
  <text x="600" y="112" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" letter-spacing="6" fill="#ffb3e1" opacity="0.9">HELLO, I'M</text>
  <text x="600" y="185" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="url(#title)">Rishika Bimal Attodi</text>
  <text x="600" y="232" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#f3dcff">Graphics  ·  Real-Time Systems  ·  Interactive Software</text>
  <text x="600" y="268" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#c9a6ff" opacity="0.85">// Computer Science (RTIS) @ SIT-DigiPen Singapore</text>
</svg>
