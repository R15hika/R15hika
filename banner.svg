<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140821"/>
      <stop offset="0.55" stop-color="#2d1046"/>
      <stop offset="1" stop-color="#55164f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ff7ac6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7ac6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3e1"/>
      <stop offset="0.5" stop-color="#ff5fb4"/>
      <stop offset="1" stop-color="#9d4dff"/>
    </linearGradient>
    <linearGradient id="wingB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7a8ff"/>
      <stop offset="0.6" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#4b2bbf"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd6ef"/>
      <stop offset="0.5" stop-color="#ff8fd0"/>
      <stop offset="1" stop-color="#c9a6ff"/>
    </linearGradient>

    <!-- one wing pair, body at origin -->
    <g id="wings">
      <path d="M0,-1 C8,-30 44,-40 52,-20 C57,-6 34,6 0,2 Z"/>
      <path d="M0,3 C24,6 40,20 32,36 C24,48 6,32 0,9 Z" opacity="0.88"/>
      <circle cx="30" cy="-18" r="4" fill="#fff" opacity="0.55"/>
      <circle cx="20" cy="20" r="3" fill="#fff" opacity="0.45"/>
    </g>

    <g id="flyA">
      <g fill="url(#wingA)">
        <g><use xlink:href="#wings"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.2 1;1 1" dur="0.5s" repeatCount="indefinite"/></g>
        <g transform="scale(-1 1)"><g><use xlink:href="#wings"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.2 1;1 1" dur="0.5s" repeatCount="indefinite"/></g></g>
      </g>
      <ellipse cx="0" cy="6" rx="3.2" ry="20" fill="#ffe3f5"/>
      <path d="M-1,-12 C-6,-24 -10,-28 -14,-30 M1,-12 C6,-24 10,-28 14,-30" stroke="#ffe3f5" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g id="flyB">
