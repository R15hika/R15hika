        <g><use xlink:href="#wings"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.25 1;1 1" dur="0.6s" repeatCount="indefinite"/></g>
        <g transform="scale(-1 1)"><g><use xlink:href="#wings"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;0.25 1;1 1" dur="0.6s" repeatCount="indefinite"/></g></g>
      </g>
      <ellipse cx="0" cy="6" rx="3.2" ry="20" fill="#efe0ff"/>
      <path d="M-1,-12 C-6,-24 -10,-28 -14,-30 M1,-12 C6,-24 10,-28 14,-30" stroke="#efe0ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
